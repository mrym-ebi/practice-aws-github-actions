name: Build and Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: コードをチェックアウト
        uses: actions/checkout@v5

        # シークレットはGithubに保存して使用
      - name: AWSの認証
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: ECRにログイン
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Terraformのセットアップ
        uses: hashicorp/setup-terraform@v4

      - name: Terraform init
        working-directory: ./terraform
        run: terraform init

      - name: TerraformでECRのみ作成
        working-directory: ./terraform
        env:
          # github.shaはコミットのハッシュ値、Terraform側に変数にして渡す。ECSタスク定義でイメージのタグを特定する用。
          TF_VAR_image_tag: ${{ github.sha }}
        run: terraform apply -target="aws_ecr_repository.main" -auto-approve

      - name: Dockerイメージをビルド＆ECRにpush
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          # github.shaをイメージのタグに付ける。
          IMAGE_TAG: ${{ github.sha }}
        working-directory: ./terraform #リポジトリ名取得のため、dockerコマンドでappディレクトリを指定
        run: |
          ECR_REPOSITORY=$(terraform output -raw ecr_repository_name)
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ../app
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Terraform apply
        working-directory: ./terraform
        env:
          TF_VAR_image_tag: ${{ github.sha }}
        run: terraform apply -auto-approve